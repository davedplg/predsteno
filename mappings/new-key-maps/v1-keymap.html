 <!DOCTYPE html> 
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chorded Keypress to Digit Mapper [[TITLE]]</title>
  <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>

<div id="instructions" >
  <a id="numpad">
    <table >
    <tr class="strong_digit">
      <td><key>Q</key><key>w</key><key>E</key><key>R</key></td>
    <td> &rarr; </td>
    <td>2,3,5,6</td>
      <td>8,7,4,1 </td>
    <td>&larr; </td>
    <td><key>U</key><key>I</key><key>O</key><key>P</key></td>
    </tr>

  <tr class="strong_digit">
    <td><key>.</key></td>
    <td>&rarr;</td>
    <td>period</td>
    <td>backspace</td>
    <td>&larr;</td>
    <td><key>backspace</key></td>
  </tr>

  <tr class="strong_digit">
    <td><key>enter</key></td>
    <td>&rarr;</td>
    <td>enter</td>
    <td>comma</td>
    <td>&larr;</td>
    <td><key>❟</key></td>
  </tr>

  <tr class="strong_digit">
    <td><key>T</key></td>
    <td>&rarr; </td>
    <td>period</td>
    <td>period</td>
    <td>&larr; </td>
    <td><key>Y</key></td>
  </tr>

  <tr class="strong_digit">
    <td><key>B</key></td>
    <td> &rarr; </td>
    <td>space</td>
    <td>space</td>
    <td>&larr; </td>
    <td><key>B</key></td>
  </tr>

  <tr class="strong_digit">
    <td><kiy>6</kiy>➕<key>T</key></td>
    <td>&rarr; </td>
    <td>comma</td>
    <td>comma</td>
    <td>&larr; </td>
    <td><key>Y</key>➕<kiy>8</kiy></td>
  </tr>

  <tr class="strong_digit">
    <td><kiy>5</kiy>➕<key>T</key></td>
    <td>&rarr; </td>
    <td>enter</td>
    <td>enter</td>
    <td>&larr; </td>
    <td><key>Y</key>➕<kiy>7</kiy></td>
  </tr>

  <tr class="strong_digit">
    <td><kiy>3</kiy>➕<key>T</key></td>
    <td>&rarr; </td>
    <td>delete</td>
    <td>delete</td>
    <td>&larr; </td>
    <td><key>Y</key>➕<kiy>4</kiy></td>
  </tr>

  <tr class="strong_digit">
    <td><kiy>2</kiy>➕<key>T</key></td>
    <td>&rarr; </td>
    <td>case</td>
    <td>case</td>
    <td>&larr; </td>
    <td><key>Y</key>➕<kiy>1</kiy></td>
  </tr>
</table>
  
 </div> 
  <a id="top8">
</div>
</body>
</html>
