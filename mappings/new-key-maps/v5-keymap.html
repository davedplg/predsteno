<!DOCTYPE html> 
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chorded Keypress to Digit Mapper [[TITLE]]</title>
  <link rel="stylesheet" href="../../styles/styles.css">
</head>
<body>
 <div id="instructions"  >
  <a id="numpad">
    <table >
  <tr class="strong_digit">
    <td><key>Q</key><key>W</key><key>E</key><key>R</key>;<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<key>F</key></td>
      <td> &rarr;</td>
      <td> 2,3,5,6;<br/>8</td>
      <td>;8,7,4,1<br/>6</td>
      <td> &larr;</td>
      <td> ;<key>U</key><key>I</key><key>O</key><key>P</key><br/><key>J</key>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
    </tr>
 <tr class="strong_digit">
      <td><key>Q</key><key>W</key><key>E</key>➕<key>R</key></td>
      <td> &rarr;</td>
      <td> 1,4,7</td>
      <td>5,3,2</td>
      <td> &larr;</td>
      <td> <key>U</key>➕<key>I</key><key>O</key><key>P</key></td>
    </tr>
 
    <tr class="strong_digit">
      <td><key>T</key>&nbsp;❟&nbsp;<key>Y</key></td>
      <td>&rarr;</td>
      <td>period</td>
      <td>space</td>
      <td>&larr;</td>
      <td><key>B</key></td>
    </tr>

    <tr class="strong_digit">
      <td><key>.</key></td>
      <td>&rarr;</td>
      <td>period</td>
      <td>backspace</td>
      <td>&larr;</td>
      <td><key>backspace</key></td>
    </tr>

    <tr class="strong_digit">
      <td><key>enter</key></td>
      <td>&rarr;</td>
      <td>enter</td>
      <td>comma</td>
      <td>&larr;</td>
      <td><key>❟</key></td>
    </tr>

 <tr class="strong_digit">
      <td><kiy>6</kiy>➕<key>T</key>/<key>Y</key>➕<kiy>8</kiy></td>
      <td>&rarr;</td>
      <td>comma</td>
      <td>enter</td>
      <td>&larr;</td>
      <td><kiy>5</kiy>➕<key>T</key>/<key>Y</key>➕<kiy>7</kiy></td>
    </tr>

    <tr class="strong_digit">
      <td><kiy>2</kiy>➕<key>T</key>/<key>Y</key>➕<kiy>1</kiy></td>
      <td>&rarr;</td>
      <td>case</td>
      <td>bspace</td>
      <td>&larr;</td>
      <td><kiy>3</kiy>➕<key>T</key>/<key>Y</key>➕<kiy>4</kiy></td>
    </tr>

 </table>
   </div> 
</body>
</html>
